[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-telco-rag"
version = "0.1.0"
description = "Open RAG pipeline for telecom specifications — O-RAN, 3GPP, CAMARA, GSMA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GSMA Open Telco AI Initiative" }
]
keywords = ["telecom", "rag", "o-ran", "3gpp", "camara", "llm", "gsma"]
dependencies = [
    "chromadb>=0.5.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "anthropic>=0.25.0,<1.0.0",
    "tqdm>=4.0.0,<5.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    # floor is stale (0.23.0) relative to what's actually verified working
    # (1.10.x) -- left as-is per scope, but the cap reflects real usage.
    "huggingface_hub>=0.23.0,<2.0.0",
]

[project.optional-dependencies]
local-embed = [
    # same stale-floor note as huggingface_hub above (verified working: 5.5.x)
    "sentence-transformers>=3.0.0,<6.0.0",
]
cloud-embed = [
    "httpx>=0.27.0,<1.0.0",
]
pdf = [
    "pypdf>=4.0.0,<7.0.0",
]
docx = [
    "python-docx>=1.1.0,<2.0.0",
    "docx2txt>=0.8,<1.0.0",
]
all = [
    "open-telco-rag[local-embed,cloud-embed,pdf,docx]",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[project.scripts]
open-telco-rag = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
# "configs" here is deliberate, not an oversight: cli/main.py's _CONFIGS_DIR
# and every embedders/*.py models_file default resolve configs/ as a sibling
# of cli/ and open_telco_rag/ via Path(__file__).parent(.parent) -- so
# installing it as its own top-level package (not nested inside
# open_telco_rag) is what makes that existing repo-root-relative lookup
# resolve correctly from site-packages too, without touching that code.
include = ["open_telco_rag*", "cli*", "configs"]

[tool.setuptools.package-data]
# find's default only picks up configs/__init__.py -- the actual *.json
# registries (embedding_models.json etc.) need an explicit package-data
# entry or a `pip install .` silently ships without them, degrading every
# --model/--strategy/--enrichment choice to a single hardcoded fallback.
configs = ["*.json", "eval_questions/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]