[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-telco-rag"
version = "0.1.0"
description = "Open RAG pipeline for telecom specifications — O-RAN, 3GPP, CAMARA, GSMA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GSMA Open Telco AI Initiative" }
]
keywords = ["telecom", "rag", "o-ran", "3gpp", "camara", "llm", "gsma"]
dependencies = [
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.25.0",
    "tqdm>=4.0.0",
    "tiktoken>=0.5.0", 
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
local-embed = [
    "sentence-transformers>=3.0.0",
]
cloud-embed = [
    "httpx>=0.27.0",
]
pdf = [
    "pypdf>=4.0.0",
]
docx = [
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
]
ragas = [
    "ragas>=0.1.0",
    "datasets>=2.0.0",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.2.0",
]
all = [
    "open-telco-rag[local-embed,cloud-embed,pdf,docx,ragas]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
open-telco-rag = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_telco_rag*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]